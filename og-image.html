<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Instrument+Sans:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0f0f0f;
      font-family: 'Instrument Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 1200px;
      height: 630px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 88px;
    }

    /* Ligne décorative gauche */
    .container::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      background: #c9a84c;
    }

    /* Motif de fond subtil */
    .bg-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 85% 50%, rgba(201,168,76,0.06) 0%, transparent 60%);
    }

    .eyebrow {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 28px;
    }

    .title {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 64px;
      font-weight: 400;
      line-height: 1.1;
      color: #f5f3ef;
      margin-bottom: 28px;
    }

    .title em {
      font-style: italic;
      color: #c9a84c;
    }

    .subtitle {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 18px;
      font-weight: 300;
      color: #7a7a74;
      line-height: 1.5;
      max-width: 680px;
    }

    .footer {
      position: absolute;
      bottom: 52px;
      left: 88px;
      right: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 22px;
      font-weight: 600;
      color: #f5f3ef;
      letter-spacing: 0.02em;
    }

    .logo span {
      color: #c9a84c;
    }

    .domain {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: #444440;
      letter-spacing: 0.05em;
    }

    .divider {
      position: absolute;
      bottom: 90px;
      left: 88px;
      right: 88px;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-pattern"></div>

    <div class="eyebrow">Accompagnement Financier Indépendant</div>

    <h1 class="title">
      Votre patrimoine,<br>
      <em>sans compromis.</em>
    </h1>

    <p class="subtitle">
      Conseil patrimonial indépendant pour particuliers à haut patrimoine.<br>
      Sans commissions. Sans conflits d'intérêts.
    </p>

    <div class="divider"></div>

    <div class="footer">
      <div class="logo">Fragoso <span>Consulting</span></div>
      <div class="domain">fragosoconsulting.fr</div>
    </div>
  </div>
</body>
</html>
